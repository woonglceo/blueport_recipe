<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blueport 마감 체크리스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a1a; min-height: 100vh; }
  .container { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }
  .brand { font-size: 12px; color: #999; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-size: 26px; font-weight: 600; color: #1a1a1a; margin-bottom: 0.4rem; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 1.5rem; }

  /* 진행률 바 */
  .progress-wrap {
    background: #fff; border: 1px solid #e8e5e0; border-radius: 14px;
    padding: 14px 16px; margin-bottom: 1.25rem;
    display: flex; align-items: center; gap: 12px;
  }
  .progress-track {
    flex: 1; height: 8px; background: #f0ede8; border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: #1a1a1a; border-radius: 99px;
    width: 0%; transition: width 0.25s ease;
  }
  .progress-text { font-size: 13px; font-weight: 600; color: #444; white-space: nowrap; }

  .top-actions { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .reset-btn {
    padding: 9px 14px; font-size: 13px; font-weight: 600;
    border: 1px solid #ddd; border-radius: 10px;
    background: #fff; color: #666; cursor: pointer; transition: all 0.15s;
  }
  .reset-btn:hover { background: #f0ede8; border-color: #bbb; color: #333; }

  /* 섹션 / 카드 */
  .section { margin-bottom: 1.5rem; }
  .section-title {
    font-size: 13px; font-weight: 700; color: #999;
    letter-spacing: 0.04em; margin-bottom: 8px; padding-left: 2px;
  }
  .card {
    background: #fff; border: 1px solid #e8e5e0;
    border-radius: 14px; overflow: hidden;
  }
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; border-bottom: 1px solid #f0ede8;
    cursor: pointer; user-select: none; transition: background 0.12s;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: #faf9f6; }

  .checkbox {
    width: 22px; height: 22px; flex-shrink: 0; border-radius: 7px;
    border: 1.5px solid #ccc; background: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .checkbox svg { width: 13px; height: 13px; opacity: 0; transition: opacity 0.1s; }
  .item.checked .checkbox { background: #1a1a1a; border-color: #1a1a1a; }
  .item.checked .checkbox svg { opacity: 1; }
  .item.checked .item-label { color: #aaa; text-decoration: line-through; }

  .item-label { font-size: 15px; color: #1a1a1a; flex: 1; line-height: 1.4; }

  .empty { text-align: center; padding: 4rem 0; color: #aaa; font-size: 15px; }
</style>
</head>
<body>
<div class="container">
  <div class="brand">Blueport Cafe</div>
  <h1>마감 체크리스트</h1>
  <div class="subtitle" id="dateLabel"></div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 0</div>
  </div>

  <div class="top-actions">
    <button class="reset-btn" onclick="resetAll()">↺ 전체 초기화</button>
  </div>

  <div id="sections"></div>
</div>

<script>
/* ============================================================
   ▼▼▼ 여기 항목만 직접 수정하면 됩니다 ▼▼▼
   각 섹션은 { title: "섹션명", items: ["항목1", "항목2", ...] } 형식입니다.
   섹션과 항목은 자유롭게 추가/삭제/수정하세요.
============================================================ */
const checklist = [
  {
    title: "장비/머신",
    items: [
      "커피머신 청소 및 전원 OFF",
      "그라인더 청소 및 원두통 비우기",
      "블렌더 세척",
      "제빙기 점검"
    ]
  },
  {
    title: "재고/식자재",
    items: [
      "우유/시럽 유통기한 확인",
      "냉장/냉장고 재고 정리",
      "베이스류 라벨링 및 보관",
      "다음날 사용할 원두 계량"
    ]
  },
  {
    title: "매장 정리",
    items: [
      "테이블/의자 정리",
      "바닥 청소",
      "쓰레기통 비우기",
      "조명 및 에어컨/난방 OFF"
    ]
  },
  {
    title: "마감 정산",
    items: [
      "POS 마감 정산",
      "현금 시재 확인",
      "마감 보고서 작성",
      "출입문 잠금 확인"
    ]
  }
];
/* ============================================================
   ▲▲▲ 여기까지 ▲▲▲
============================================================ */

const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

// 날짜가 바뀌면 체크 상태를 자동으로 초기화하기 위한 키
function todayKey() {
  const d = new Date();
  return `closing-${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function loadState() {
  try {
    const raw = localStorage.getItem(todayKey());
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

function saveState(state) {
  try { localStorage.setItem(todayKey(), JSON.stringify(state)); } catch (e) {}
}

let state = loadState();

function itemId(sectionIdx, itemIdx) {
  return `${sectionIdx}-${itemIdx}`;
}

function render() {
  const wrap = document.getElementById('sections');

  if (!checklist.length) {
    wrap.innerHTML = '<div class="empty">체크리스트 항목이 없어요</div>';
    updateProgress(0, 0);
    return;
  }

  let total = 0, checked = 0;

  wrap.innerHTML = checklist.map((section, sIdx) => {
    const itemsHtml = section.items.map((label, iIdx) => {
      const id = itemId(sIdx, iIdx);
      const isChecked = !!state[id];
      total++;
      if (isChecked) checked++;
      return `<div class="item ${isChecked ? 'checked' : ''}" onclick="toggleItem('${id}')">
        <div class="checkbox">${CHECK_ICON}</div>
        <div class="item-label">${label}</div>
      </div>`;
    }).join('');

    return `<div class="section">
      <div class="section-title">${section.title}</div>
      <div class="card">${itemsHtml}</div>
    </div>`;
  }).join('');

  updateProgress(checked, total);
}

function toggleItem(id) {
  state[id] = !state[id];
  saveState(state);
  render();
}

function updateProgress(checked, total) {
  const pct = total ? Math.round((checked / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${checked} / ${total}`;
}

function resetAll() {
  if (!confirm('체크 상태를 모두 초기화할까요?')) return;
  state = {};
  saveState(state);
  render();
}

function setDateLabel() {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('dateLabel').textContent =
    `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} (${days[d.getDay()]}) 마감`;
}

setDateLabel();
render();
</script>
</body>
</html>

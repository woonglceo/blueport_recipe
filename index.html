<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blueport 레시피 검색</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a1a; min-height: 100vh; }
  .container { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem; }
  .brand { font-size: 12px; color: #999; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-size: 26px; font-weight: 600; color: #1a1a1a; margin-bottom: 1.5rem; }
  .search-row { display: flex; gap: 8px; margin-bottom: 1rem; }
  .search-row input {
    flex: 1; padding: 10px 14px; font-size: 15px;
    border: 1px solid #ddd; border-radius: 10px;
    background: #fff; outline: none; transition: border 0.15s;
  }
  .search-row input:focus { border-color: #aaa; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .chip {
    font-size: 13px; padding: 5px 12px; border-radius: 99px;
    border: 1px solid #ddd; color: #666; background: #fff;
    cursor: pointer; transition: all 0.15s;
  }
  .chip:hover { background: #f0ede8; border-color: #bbb; color: #333; }
  .chip.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .results { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: #fff; border: 1px solid #e8e5e0;
    border-radius: 14px; padding: 1rem 1.25rem;
  }
  .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .cat-badge { font-size: 11px; padding: 3px 9px; border-radius: 99px; font-weight: 600; }
  .cat-커피        { background: #FEF3C7; color: #92400E; }
  .cat-논커피      { background: #D1FAE5; color: #065F46; }
  .cat-에이드주스  { background: #FFE4E6; color: #9F1239; }
  .cat-스무디프라페{ background: #EDE9FE; color: #5B21B6; }
  .cat-베이스      { background: #E0F2FE; color: #075985; }
  .base-recipe-block {
    border: 1px solid #f0ede8; border-radius: 10px;
    padding: 12px 14px; background: #fafaf8;
    font-size: 13px; color: #333; line-height: 1.7;
  }
  .base-recipe-label {
    font-size: 11px; font-weight: 700; color: #aaa;
    letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .menu-name { font-size: 16px; font-weight: 600; color: #1a1a1a; }
  .size-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .size-block { border: 1px solid #f0ede8; border-radius: 10px; padding: 10px 12px; background: #fafaf8; }
  .size-label { font-size: 11px; font-weight: 700; color: #aaa; margin-bottom: 8px; letter-spacing: 0.06em; }
  .reset-btn {
    padding: 10px 14px; font-size: 13px; font-weight: 600;
    border: 1px solid #ddd; border-radius: 10px;
    background: #fff; color: #666; cursor: pointer; transition: all 0.15s;
    white-space: nowrap;
  }
  .reset-btn:hover { background: #f0ede8; border-color: #bbb; color: #333; }
  .temp-row {
    margin-bottom: 5px; cursor: pointer; border-radius: 6px; padding: 2px 4px; transition: background 0.12s;
    display: flex; align-items: flex-start; gap: 6px;
  }
  .temp-row:hover { background: #f5f4f0; }
  .temp-row.focused { background: transparent; }
  .card.dimmed { opacity: 0.25; cursor: pointer; }
  .size-block.dimmed { opacity: 0.2; }
  .size-block.focused-block {
    border-color: #1a1a1a;
    grid-column: 1 / -1;
    padding: 16px 20px;
  }
  .size-block.focused-block .size-label { font-size: 13px; margin-bottom: 12px; color: #555; }
  .size-block.focused-block .recipe-text { font-size: 14px; color: #1a1a1a; }
  .size-block.focused-block .temp-tag { font-size: 12px; padding: 3px 8px; }
  .size-block.focused-block .temp-row { margin-bottom: 0; }
  .back-btn {
    display: none; margin-bottom: 1rem;
    padding: 8px 16px; font-size: 13px; font-weight: 600;
    border: 1px solid #ddd; border-radius: 10px;
    background: #fff; color: #444; cursor: pointer; transition: all 0.15s;
  }
  .back-btn:hover { background: #f0ede8; }
  .back-btn.visible { display: inline-flex; align-items: center; gap: 6px; }
  .temp-tag {
    font-size: 10px; font-weight: 700; padding: 2px 6px;
    border-radius: 4px; display: inline-block; vertical-align: middle;
    flex-shrink: 0; white-space: nowrap;
  }
  .hot-tag { background: #FEE2E2; color: #B91C1C; }
  .ice-tag { background: #DBEAFE; color: #1D4ED8; }
  .recipe-text { font-size: 12px; color: #555; line-height: 1.55; flex: 1; min-width: 0; }
  .none-text { font-size: 12px; color: #ccc; }
  .note-bar { margin-top: 10px; padding: 7px 10px; background: #fffbf0; border: 1px solid #f0e5c0; border-radius: 8px; font-size: 12px; color: #7a5c00; }
  .note-label { font-weight: 700; margin-right: 4px; }
  .empty { text-align: center; padding: 4rem 0; color: #aaa; font-size: 15px; }
  .tab-bar {
    display: flex; gap: 4px; margin-bottom: 1.75rem;
    border-bottom: 1px solid #e8e5e0;
    position: sticky; top: 0; z-index: 60;
    background: #f5f4f0;
    margin-left: -1.25rem; margin-right: -1.25rem;
    padding-left: 1.25rem; padding-right: 1.25rem;
  }
  .tab-item {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 8px 13px; font-size: 13.5px; font-weight: 600;
    color: #999; text-decoration: none; background: none; border: none;
    position: relative; cursor: pointer; transition: color 0.15s;
  }
  .tab-item .tab-icon { font-size: 15px; opacity: 0.8; }
  .tab-item:hover { color: #444; }
  .tab-item.active {
    color: #1a1a1a;
  }
  .tab-item.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: #1a1a1a; border-radius: 2px 2px 0 0;
  }
  @media (max-width: 500px) {
    .tab-item { font-size: 12px; padding: 10px 4px 12px; }
    .tab-item .tab-icon { font-size: 14px; }
  }
  /* 우하단 고정 버튼 그룹 */
  .fab-group {
    position: fixed; bottom: 24px; right: 20px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 100;
  }
  .fab {
    width: 48px; height: 48px;
    border-radius: 50%; border: 1px solid #ddd;
    background: #fff; color: #444;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: all 0.15s;
  }
  .fab:hover { background: #f0ede8; border-color: #bbb; }
  .fab:active { transform: scale(0.93); }
  .fab.disabled { opacity: 0.3; pointer-events: none; }
  @media (max-width: 500px) {
    .size-grid { grid-template-columns: 1fr; }
    .temp-row { flex-direction: column; gap: 3px; align-items: flex-start; }
    .recipe-text { display: block; }
  }

  /* ── 레시피 검색창 상단 고정 ── */
  .recipe-sticky {
    position: sticky;
    top: 48px; /* 탭바 높이 보정 */
    z-index: 50;
    background: #f5f4f0;
    padding-top: 10px;
    padding-bottom: 0;
    margin-left: -1.25rem;
    margin-right: -1.25rem;
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  /* ── 체크리스트·재고표 progress-wrap 상단 고정 ── */
  .progress-sticky {
    position: sticky;
    top: 48px; /* 탭바 높이 보정 */
    z-index: 50;
    background: #f5f4f0;
    padding-top: 10px;
    padding-bottom: 0;
    margin-left: -1.25rem;
    margin-right: -1.25rem;
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .progress-sticky .progress-wrap {
    margin-bottom: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  @media (max-width: 500px) {
    .recipe-sticky { top: 44px; }
    .progress-sticky { top: 44px; }
  }
  /* 체크리스트 탭 전용 스타일 (네임스페이스로 분리하여 레시피 카드와 충돌 방지) */
  .checklist-page h1 { margin-bottom: 0.4rem; }
  .checklist-page .subtitle { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
  .checklist-page .progress-wrap {
    background: #fff; border: 1px solid #e8e5e0; border-radius: 14px;
    padding: 14px 16px; margin-bottom: 1.25rem;
    display: flex; align-items: center; gap: 12px;
  }
  .checklist-page .progress-track {
    flex: 1; height: 8px; background: #f0ede8; border-radius: 99px; overflow: hidden;
  }
  .checklist-page .progress-fill {
    height: 100%; background: #1a1a1a; border-radius: 99px;
    width: 0%; transition: width 0.25s ease;
  }
  .checklist-page .progress-text { font-size: 13px; font-weight: 600; color: #444; white-space: nowrap; }
  .checklist-page .top-actions { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .checklist-page .section { margin-bottom: 1.5rem; }
  .checklist-page .section-title {
    font-size: 13px; font-weight: 700; color: #999;
    letter-spacing: 0.04em; margin-bottom: 8px; padding-left: 2px;
  }
  .checklist-page .card {
    background: #fff; border: 1px solid #e8e5e0;
    border-radius: 14px; overflow: hidden;
  }
  .checklist-page .item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; border-bottom: 1px solid #f0ede8;
    cursor: pointer; user-select: none; transition: background 0.12s;
  }
  .checklist-page .item:last-child { border-bottom: none; }
  .checklist-page .item:hover { background: #faf9f6; }
  .checklist-page .checkbox {
    width: 22px; height: 22px; flex-shrink: 0; border-radius: 7px;
    border: 1.5px solid #ccc; background: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .checklist-page .checkbox svg { width: 13px; height: 13px; opacity: 0; transition: opacity 0.1s; }
  .checklist-page .item.checked .checkbox { background: #1a1a1a; border-color: #1a1a1a; }
  .checklist-page .item.checked .checkbox svg { opacity: 1; }
  .checklist-page .item.checked .item-label { color: #aaa; text-decoration: line-through; }
  .checklist-page .item-label { font-size: 15px; color: #1a1a1a; flex: 1; line-height: 1.4; }
  .checklist-page .empty { text-align: center; padding: 4rem 0; color: #aaa; font-size: 15px; }
  .checklist-page .day-tab-bar { display: flex; gap: 5px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .checklist-page .day-tab {
    flex: 1; min-width: 30px; padding: 6px 0; font-size: 12px; font-weight: 700;
    text-align: center; border: 1px solid #ddd; border-radius: 8px;
    background: #fff; color: #888; cursor: pointer; transition: all 0.15s;
  }
  .checklist-page .day-tab:hover { background: #f0ede8; color: #444; }
  .checklist-page .day-tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .checklist-page .today-dot {
    display: inline-block; width: 4px; height: 4px; border-radius: 50%;
    background: #1a1a1a; margin-left: 3px; vertical-align: middle;
  }
  .checklist-page .day-tab.active .today-dot { background: #fff; }
  /* 체크리스트 항목 사라짐 애니메이션 */
  .checklist-page .item.removing {
    opacity: 0; transform: scaleY(0.6) translateX(8px);
    transition: opacity 0.18s ease, transform 0.18s ease;
    pointer-events: none;
  }
  /* 체크 완료 항목 칩 스타일 */
  .checklist-page .done-section { margin-top: 0.5rem; margin-bottom: 1.5rem; }
  .checklist-page .done-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px; }
  .checklist-page .done-chip {
    font-size: 12.5px; padding: 6px 12px; border-radius: 99px;
    background: #f0ede8; color: #999; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    text-decoration: line-through; transition: all 0.15s;
  }
  .checklist-page .done-chip:hover { background: #e5e1da; color: #666; }
  .checklist-page .done-chip .undo-icon { font-size: 10px; text-decoration: none; opacity: 0.6; }
  @media (max-width: 500px) {
    .checklist-page .day-tab { font-size: 11px; padding: 5px 0; }
  }
  /* 재고표 전용 - 바둑판(그리드) 체크리스트 */
  .inventory-page .grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  }
  .inventory-page .grid-item {
    background: #fff; border: 1px solid #e8e5e0; border-radius: 10px;
    padding: 8px 5px 6px; min-height: 64px;
    display: flex; flex-direction: column; gap: 4px;
    transition: opacity 0.18s ease, transform 0.18s ease, border-color 0.12s;
  }
  .inventory-page .grid-item.removing { opacity: 0; transform: scale(0.8); }
  .inventory-page .grid-item-label {
    flex: 1; text-align: center; font-size: 11.5px; font-weight: 600; color: #1a1a1a;
    line-height: 1.25;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    cursor: pointer; user-select: none; border-radius: 6px; padding: 4px 1px;
    transition: background 0.12s;
  }
  .inventory-page .grid-item-label:hover { background: #faf9f6; }
  .inventory-page .grid-item-label:active { transform: scale(0.95); }
  .inventory-page .grid-icon { font-size: 13px; opacity: 0.35; }
  .inventory-page .grid-input {
    width: 100%; font-size: 10.5px; padding: 4px 3px; text-align: center;
    border: 1px solid #e8e5e0; border-radius: 6px; background: #fafaf8;
    color: #1a1a1a; outline: none; transition: border 0.15s, background 0.15s;
  }
  .inventory-page .grid-input:focus { border-color: #aaa; background: #fff; }
  .inventory-page .grid-input::placeholder { color: #c9c5bc; }
  .inventory-page .done-section { margin-top: 0.5rem; }
  .inventory-page .done-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px; }
  .inventory-page .done-chip {
    font-size: 12.5px; padding: 6px 12px; border-radius: 99px;
    background: #f0ede8; color: #999; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    text-decoration: line-through; transition: all 0.15s;
  }
  .inventory-page .done-chip:hover { background: #e5e1da; color: #666; }
  .inventory-page .done-chip .undo-icon { font-size: 10px; text-decoration: none; }
  @media (max-width: 500px) {
    .inventory-page .grid { grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .inventory-page .grid-item { padding: 7px 4px 5px; min-height: 58px; }
    .inventory-page .grid-item-label { font-size: 10.5px; }
    .inventory-page .grid-input { font-size: 10px; padding: 3px 2px; }
  }
</style>

<style>
/* ===== POS 트레이닝 화면 스타일 (pos_menu.html + cafe_training.html 병합, #posMenuView / #cafeTrainingView 로 스코프 처리) ===== */

        #cafeTrainingView { font-family: 'Malgun Gothic', sans-serif; background-color: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100%; margin: 0; }
        .wrapper { display: flex; justify-content: center; max-width: 450px; width: 100%; padding: 10px; box-sizing: border-box; }
        .panel { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); flex: 1; display: flex; flex-direction: column; }
        
        /* 타이틀 여백 축소 */
        #cafeTrainingView h3 { margin-top: 0; color: #333; border-bottom: 2px solid #5d4037; padding-bottom: 5px; margin-bottom: 10px; font-size: 16px; }
        
        /* 옵션 설정 영역 압축 */
        .count-setting { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: #f5f5f5; padding: 8px 12px; border-radius: 6px; border: 1px solid #e0e0e0; font-size: 13px; }
        .count-setting select { padding: 4px 8px; font-size: 13px; border-radius: 4px; border: 1px solid #ccc; font-family: inherit; }

        /* 주문 버튼 여백 조정 */
        #cafeTrainingView button { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .btn-brown { background-color: #5d4037; }
        .btn-brown:hover { background-color: #3e2723; }
        
        /* 영수증 박스: 8잔이 들어와도 스크롤바가 안 생기도록 높이 조정 및 여백 압축 */
        .receipt-container { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .receipt { background: #fff; border: 1px solid #ddd; min-height: 380px; padding: 12px 15px; font-family: 'Courier New', monospace; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; overflow: hidden; }
        .receipt::after { content: ""; position: absolute; bottom: -10px; left: 0; right: 0; height: 10px; background: linear-gradient(-45deg, #eef2f3 5px, transparent 0), linear-gradient(45deg, #eef2f3 5px, transparent 0); background-size: 10px 10px; }
        .receipt-title { text-align: center; font-weight: bold; font-size: 15px; margin-bottom: 10px; border-bottom: 1px dashed #333; padding-bottom: 6px; }
        
        /* 개별 주문 아이템 간격 및 글자 크기 축소 */
        .order-block { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px dotted #eee; text-align: left; }
        .order-block:last-child { border-bottom: none; }
        .receipt-item { font-size: 13px; font-weight: bold; color: #111; display: flex; justify-content: space-between; align-items: center; line-height: 1.2; }
        .item-count { color: #ff5722; font-size: 15px; }
    

  :root {
    --pos-bg: #1a1f3a;
    --pos-header: #2a3060;
    --pos-tab-active: #e05555;
    --pos-tab-inactive: #d4a820;
    --pos-cell-bg: #c8dff5;
    --pos-cell-border: #8ab0d0;
    --pos-cell-hover: #a0c4e8;
    --pos-text: #1a2040;
    --pos-price: #1a2040;
    --pos-empty: #ddeeff88;
  }

  #posMenuView, #posMenuView * { box-sizing: border-box; margin: 0; padding: 0; }

  #posMenuView {
    font-family: 'Noto Sans KR', sans-serif;
    background: #2a3060;
    color: var(--pos-text);
    width: 100%;
    height: 100%;
  }

  /* 전체 화면을 상하로 분할 */
  .pos-wrapper {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  /* 상단: 주문패널 + 메뉴패널 */
  .pos-top {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* 왼쪽: 주문 패널 */
  .order-panel {
    flex: 1;
    min-width: 0;
    background: #c8dff5;
    display: flex;
    flex-direction: column;
    border-right: 3px solid #3a4480;
    font-size: 0.8rem;
    height: 100%;
    overflow: hidden;
  }

  .order-panel-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 주문 목록 테이블 */
  .order-header {
    display: grid;
    grid-template-columns: 36px 1fr 52px 64px;
    background: #3a5080;
    color: #fff;
    font-weight: 700;
    font-size: 0.75rem;
    padding: 4px 6px;
    gap: 2px;
  }
  .order-header span { text-align: center; }

  .order-list {
    flex: 1;
    overflow-y: auto;
    background: #fff;
    min-height: 180px;
    max-height: 260px;
    border-bottom: 2px solid #8ab0d0;
  }
  .order-row {
    display: grid;
    grid-template-columns: 36px 1fr 52px 64px;
    padding: 3px 6px;
    gap: 2px;
    align-items: center;
    border-bottom: 1px solid #d0e4f4;
    cursor: pointer;
    transition: background 0.1s;
  }
  .order-row:hover { background: #e0f0ff; }
  .order-row.selected { background: #b0d4f8; }
  .order-row span { font-size: 0.73rem; color: #1a2040; }
  .order-row .o-seq { text-align: center; color: #666; }
  .order-row .o-qty { text-align: center; }
  .order-row .o-price { text-align: right; }

  /* 중단 버튼열 */
  .order-mid {
    background: #b8cce0;
    padding: 5px 6px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .order-mid-row {
    display: flex;
    gap: 4px;
    align-items: center;
  }

const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

// 겹받침(복합 자모) → 낱자 두 개로 분해
// 예: ㄻ(U+11B1) → ㄹㅁ, ㄳ → ㄱㅅ 등
const DOUBLE_JAMO = {
  'ㄳ': 'ㄱㅅ', 'ㄵ': 'ㄴㅈ', 'ㄶ': 'ㄴㅎ',
  'ㄺ': 'ㄹㄱ', 'ㄻ': 'ㄹㅁ', 'ㄼ': 'ㄹㅂ',
  'ㄽ': 'ㄹㅅ', 'ㄾ': 'ㄹㅌ', 'ㄿ': 'ㄹㅍ',
  'ㅀ': 'ㄹㅎ', 'ㅄ': 'ㅂㅅ',
};

// NFC 조합된 겹받침 자모를 낱자로 풀기
// NFC로 조합된 겹받침 자모를 낱자 두 개로 분해합니다. (예: ㄻ → ㄹㅁ)
function decomposeDoubleJamo(str) {
  return [...str].map(ch => DOUBLE_JAMO[ch] || ch).join('');
}

// 한글 문자열에서 각 글자의 초성만 추출해 문자열로 반환합니다.
function getChosung(str) {
  return [...str].map(ch => {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code < 0 || code > 11171) return ch;
    return CHO[Math.floor(code / (21 * 28))];
  }).join('');
}

// 낱자 자음(초성 + 겹받침 분해 후 낱자)인지 확인
const ALL_JAMO = new Set([...CHO, ...Object.keys(DOUBLE_JAMO)]);
// 입력 문자열이 초성(자음)으로만 구성되어 있는지 확인합니다.
function isChosungOnly(str) {
  return [...str].every(ch => ALL_JAMO.has(ch) || /\s/.test(ch));
}

// 메뉴명의 초성이 쿼리(초성 입력)와 일치하는지 확인합니다.
function matchesChosung(menu, query) {
  // 겹받침 분해 후 비교 (예: ㄻ → ㄹㅁ)
  const cleanedQuery = decomposeDoubleJamo(query.replace(/\s/g, ''));
  const tokens = buildSearchTokens(menu.name);
  return tokens.some(tok => getChosung(tok).includes(cleanedQuery));
}
// ─────────────────────────────────────────────────────────────

// 엔터 누르면 모바일 키보드 내리기
// 엔터 키 입력 시 모바일 키보드를 내립니다.
function handleEnter(e) {
  if (e.key === 'Enter') {
    e.target.blur();
  }
}



// 카테고리 필터(전체/커피/논커피 등)를 설정하고 결과를 다시 렌더링합니다.
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === f));
  render();
}

// 카테고리 이름에서 CSS 클래스명으로 사용할 키 문자열을 생성합니다. (공백·슬래시 제거)
function catKey(cat) {
  return cat.replace(/[\/\s]/g, '');
}

// 검색 입력값을 파싱하여 메뉴명·사이즈·온도 조건으로 분리합니다.
function parseQuery(raw) {
  const tokens = raw.trim().toLowerCase().split(/\s+/);
  const sizeKeywords = { r: 'R', l: 'L', d: 'D' };
  // partial prefix match: 아 -> 아이스, h -> hot, ic -> ice 등
  function matchTemp(t) {
    if ('hot'.startsWith(t) || '핫'.startsWith(t)) return 'hot';
    if ('ice'.startsWith(t) || 'iced'.startsWith(t) || '아이스'.startsWith(t)) return 'ice';
    return null;
  }

  let sizes = [], temps = [], nameTokens = [];
  tokens.forEach(t => {
    if (sizeKeywords[t]) sizes.push(sizeKeywords[t]);
    else if (t.length >= 1 && matchTemp(t)) temps.push(matchTemp(t));
    else if (t) nameTokens.push(t);
  });
  return {
    name: nameTokens.join(' '),
    sizes: sizes.length ? sizes : ['R', 'L', 'D'],
    temps: temps.length ? temps : ['hot', 'ice'],
  };
}

// 메뉴명에서 검색 가능한 키워드 토큰 목록을 생성
// 예: "카페라떼 (바닐라/카라멜/헤이즐넛)" → ["카페라떼", "바닐라카페라떼", "카라멜카페라떼", "헤이즐넛카페라떼", "바닐라라떼", "카라멜라떼", "헤이즐넛라떼"]
// 예: "수제차 (유자/레몬/자몽/대추/진저)" → ["수제차", "유자차", "레몬차", "자몽차", "대추차", "진저차", "유자수제차", ...]
// 메뉴명에서 검색 가능한 다양한 키워드 토큰 목록을 생성합니다.
// 예: "카페라떼 (바닐라/카라멜)" → ["카페라떼", "바닐라", "바닐라카페라떼", "바닐라라떼", ...]
function buildSearchTokens(menuName) {
  const lower = menuName.toLowerCase().replace(/\s/g, '');
  const tokens = [lower];

  // 괄호 안의 옵션 추출
  const parenMatch = menuName.match(/\(([^)]+)\)/);
  if (parenMatch) {
    const options = parenMatch[1].split('/').map(o => o.trim().toLowerCase().replace(/\s/g, ''));
    const baseName = menuName.replace(/\s*\([^)]+\)/, '').toLowerCase().replace(/\s/g, '');

    options.forEach(opt => {
      // 옵션 단독 (예: "헤이즐넛")
      tokens.push(opt);
      // 옵션 + 베이스명 (예: "헤이즐넛카페라떼")
      tokens.push(opt + baseName);
      // 베이스명 + 옵션 (예: "카페라떼헤이즐넛")
      tokens.push(baseName + opt);

      // 베이스명에서 공통 접미사 추출해서 조합 (예: "라떼", "차", "티" 등)
      const suffixes = ['라떼', '차', '티', '에이드', '주스', '스무디', '프라페', '요거트'];
      suffixes.forEach(suf => {
        if (baseName.endsWith(suf)) {
          // 옵션 + 접미사 (예: "레몬차", "헤이즐넛라떼")
          tokens.push(opt + suf);
        }
      });
    });
  }

  return tokens;
}

// 섞기[...], 블렌더 N번[...] 패턴에서 레이블(대괄호 포함)만 굵게, 내용은 일반 텍스트로
// 레시피 텍스트에서 "섞기[...]", "블렌더N번[...]" 패턴의 레이블을 굵게 강조합니다.
function formatRecipe(text) {
  return text.replace(/((?:블렌더\s*\d*번?|섞기)\s*)\[([^\]]+)\]/g, (_, label, content) => {
    return `<b>${label.trim()}[</b>${content}<b>]</b>`;
  });
}

// 검색어가 메뉴 토큰 중 하나에 포함되는지, 또는 메뉴 토큰이 검색어를 포함하는지 확인
// 초성만 입력된 경우 초성 검색도 지원
// 검색어가 메뉴 토큰에 포함되는지 확인합니다. 초성 검색도 지원합니다.
function matchesSearch(menu, nameNoSpace) {
  if (!nameNoSpace) return true;

  // 초성만 입력된 경우 → 초성 검색
  if (isChosungOnly(nameNoSpace)) {
    return matchesChosung(menu, nameNoSpace);
  }

  const searchLower = nameNoSpace.toLowerCase();
  const tokens = buildSearchTokens(menu.name);
  return tokens.some(tok => tok.includes(searchLower) || searchLower.includes(tok));
}

// 검색어와 필터 조건에 따라 메뉴 목록을 필터링하고 결과 카드를 렌더링합니다.
function render() {
  const raw = document.getElementById('q').value;
  const { name, sizes, temps } = parseQuery(raw);
  // 메뉴명 띄어쓰기 무시: 검색어와 메뉴명 모두 공백 제거 후 비교
  const nameNoSpace = name.replace(/\s/g, '');

  const filtered = menus.filter(m => {
    const matchName = matchesSearch(m, nameNoSpace);
    const matchCat = activeFilter === '전체' || m.cat === activeFilter;
    if (m.cat === '베이스') return matchName && matchCat;
    const hasData = sizes.some(s => temps.some(t => m[s][t] !== '-'));
    return matchName && matchCat && (raw.trim() === '' || hasData);
  });

  const el = document.getElementById('results');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty">검색 결과가 없어요 🔍</div>';
    return;
  }

  el.innerHTML = filtered.map(m => {
    const ck = catKey(m.cat);

    // 베이스 카테고리: 사이즈/온도 없이 단일 블록 + 비고는 별도 표시
    if (m.cat === '베이스') {
      const noteHtml = m.note ? `<div class="note-bar"><span class="note-label">📌 비고</span>${m.note}</div>` : '';
      const storageText = m.storage || '냉장보관';
      const recipeText = m.recipe || '';
      return `<div class="card">
        <div class="card-header">
          <span class="cat-badge cat-${ck}">${m.cat}</span>
          <span class="menu-name">${m.name}</span>
        </div>
        <div class="base-recipe-block">
          <div class="base-recipe-label">🧊 ${storageText}</div>
          ${recipeText ? `<div style="font-size:13px;color:#333;line-height:1.7;">${recipeText}</div>` : ''}
        </div>
        ${noteHtml}
      </div>`;
    }

    const sizeBlocks = sizes.map(s => {
      const d = m[s];
      const hotLine = temps.includes('hot') && d.hot !== '-'
        ? `<div class="temp-row" onclick="focusRecipe(this)""><span class="temp-tag hot-tag">HOT</span><span class="recipe-text">${formatRecipe(d.hot)}</span></div>`
        : '';
      const iceLine = temps.includes('ice') && d.ice !== '-'
        ? `<div class="temp-row" onclick="focusRecipe(this)"><span class="temp-tag ice-tag">ICE</span><span class="recipe-text">${formatRecipe(d.ice)}</span></div>`
        : '';
      const content = hotLine + iceLine || '<span class="none-text">해당 없음</span>';
      return `<div class="size-block">
        <div class="size-label">${s} 사이즈</div>
        ${content}
      </div>`;
    }).join('');

    const noteHtml = m.note ? `<div class="note-bar"><span class="note-label">📌 비고</span>${m.note}</div>` : '';
    return `<div class="card">
      <div class="card-header">
        <span class="cat-badge cat-${ck}">${m.cat}</span>
        <span class="menu-name">${m.name}</span>
      </div>
      <div class="size-grid">${sizeBlocks}</div>
      ${noteHtml}
    </div>`;
  }).join('');
}

// 검색어·필터·포커스를 모두 초기화하고 전체 목록을 다시 렌더링합니다.
function resetAll() {
  document.getElementById('q').value = '';
  activeFilter = '전체';
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === '전체'));
  clearFocus();
  render();
}

let lastQuery = ''; // 되돌리기용 저장

// 우하단 FAB 검색 버튼: 페이지 최상단으로 스크롤 후 검색창에 포커스합니다.
function fabSearch() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => document.getElementById('q').focus(), 300);
}

// 우하단 FAB 초기화 버튼: 현재 검색어를 저장한 뒤 전체 초기화합니다. (되돌리기 가능)
function fabResetAll() {
  const q = document.getElementById('q');
  lastQuery = q.value;
  updateUndoBtn();
  q.value = '';
  activeFilter = '전체';
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === '전체'));
  clearFocus();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => q.focus(), 300);
}

// 마지막으로 저장된 검색어를 복원하여 초기화를 되돌립니다.
function undoReset() {
  if (!lastQuery) return;
  const q = document.getElementById('q');
  q.value = lastQuery;
  lastQuery = '';
  updateUndoBtn();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => q.focus(), 300);
}

// 저장된 이전 검색어 유무에 따라 되돌리기 버튼의 활성/비활성 상태를 업데이트합니다.
function updateUndoBtn() {
  const btn = document.getElementById('fabUndo');
  if (lastQuery) btn.classList.remove('disabled');
  else btn.classList.add('disabled');
}

// 레시피 행(temp-row)을 클릭하면 해당 항목을 포커스하고 나머지를 흐리게 처리합니다.
// 이미 포커스된 경우 포커스를 해제합니다.
function focusRecipe(row) {
  if (row.classList.contains('focused')) { clearFocus(); return; }
  document.querySelectorAll('.card').forEach(card => card.classList.add('dimmed'));
  document.querySelectorAll('.size-block').forEach(b => b.classList.add('dimmed'));
  const sizeBlock = row.closest('.size-block');
  const card = row.closest('.card');
  const grid = card.querySelector('.size-grid');
  card.classList.remove('dimmed');
  sizeBlock.classList.remove('dimmed');
  sizeBlock.classList.add('focused-block');
  // dimmed된 카드 클릭하면 clearFocus
  document.querySelectorAll('.card.dimmed').forEach(c => c.onclick = () => clearFocus());
  card.classList.remove('dimmed');
  sizeBlock.classList.remove('dimmed');
  sizeBlock.classList.add('focused-block');
  // 그리드를 1칸으로 바꿔서 focused-block이 전체 너비 차지
  grid._origCols = grid.style.gridTemplateColumns;
  grid.style.gridTemplateColumns = '1fr';
  card.querySelectorAll('.temp-row').forEach(r => { if (r !== row) r.style.display = 'none'; });
  card.querySelectorAll('.size-block').forEach(b => { if (b !== sizeBlock) b.style.display = 'none'; });
  row.classList.add('focused');
  document.getElementById('backBtn').classList.add('visible');
}

// 모든 카드·사이즈블록·온도행의 포커스/dim 상태를 초기화합니다.
function clearFocus() {
  document.querySelectorAll('.card').forEach(card => {
    card.classList.remove('dimmed');
    card.onclick = null;
  });
  document.querySelectorAll('.size-block').forEach(b => {
    b.classList.remove('dimmed', 'focused-block');
    b.style.display = '';
  });
  document.querySelectorAll('.size-grid').forEach(g => {
    if (g._origCols !== undefined) { g.style.gridTemplateColumns = g._origCols; delete g._origCols; }
  });
  document.querySelectorAll('.temp-row').forEach(r => {
    r.classList.remove('focused');
    r.style.display = '';
  });
  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.classList.remove('visible');
}

render();
updateUndoBtn();

/* ============================================================
   오래된 localStorage 데이터 정리 (2주 = 14일 지난 데이터 삭제)
   오픈/마감 체크리스트("opening-월-2026-6-1" 형식)와
   재고표("inventory-2026-6-1" 형식) 저장 키를 검사해서
   14일보다 오래된 항목은 자동으로 지워 브라우저 저장공간을 유지합니다.
============================================================ */
// localStorage에서 14일 이상 지난 오픈/마감 체크리스트 및 재고표 데이터를 자동 삭제합니다.
function cleanupOldChecklistStorage() {
  const RETENTION_DAYS = 14;
  const now = new Date();
  const cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate() - RETENTION_DAYS);

  const checklistKeyPattern = /^(opening|closing|weekend)-(mon|tue|wed|thu|fri|sat|sun)-(\d{4})-(\d{1,2})-(\d{1,2})$/;
  const inventoryKeyPattern = /^inventory-(\d{4})-(\d{1,2})-(\d{1,2})$/;

  const keysToRemove = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key) continue;

    let y, mo, da;
    const m1 = key.match(checklistKeyPattern);
    const m2 = key.match(inventoryKeyPattern);
    if (m1) { y = +m1[3]; mo = +m1[4]; da = +m1[5]; }
    else if (m2) { y = +m2[1]; mo = +m2[2]; da = +m2[3]; }
    else continue;

    const keyDate = new Date(y, mo - 1, da);
    if (keyDate < cutoff) keysToRemove.push(key);
  }

  keysToRemove.forEach(k => {
    try { localStorage.removeItem(k); } catch (e) {}
  });
}

cleanupOldChecklistStorage();

const checklistState = { opening: {}, closing: {} };

// 오늘 요일에 해당하는 키(sun/mon/.../sat)를 반환합니다.
function checklistTodayDayKey() {
  const dayMap = ['sun','mon','tue','wed','thu','fri','sat'];
  return dayMap[new Date().getDay()];
}

const checklistActiveDay = {
  opening: checklistTodayDayKey(),
  closing: checklistTodayDayKey()
};

// 오픈/마감 체크리스트의 localStorage 저장 키를 생성합니다. (예: "opening-mon-2026-6-28")
// 주말(토/일)은 오픈·마감 구분 없이 동일한 키를 사용합니다. (예: "weekend-sat-2026-6-28")
function checklistStorageKey(type, day) {
  const d = new Date();
  const prefix = (day === 'sat' || day === 'sun') ? 'weekend' : type;
  return `${prefix}-${day}-${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

// localStorage에서 특정 타입(opening/closing)과 요일의 체크 상태를 불러옵니다.
function loadChecklistState(type, day) {
  try {
    const raw = localStorage.getItem(checklistStorageKey(type, day));
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

// 현재 체크 상태를 localStorage에 저장합니다.
function saveChecklistState(type, day) {
  try { localStorage.setItem(checklistStorageKey(type, day), JSON.stringify(checklistState[type][day] || {})); } catch (e) {}
}

// 오픈 또는 마감 탭의 요일 탭 버튼을 렌더링합니다. 오늘 요일에는 점 표시를 추가합니다.
function renderDayTabs(type) {
  const wrap = document.getElementById('dayTabs-' + type);
  const todayKey = checklistTodayDayKey();
  wrap.innerHTML = DAYS.map(d => {
    const isActive = checklistActiveDay[type] === d.key;
    const isToday = d.key === todayKey;
    return `<button class="day-tab ${isActive ? 'active' : ''}" onclick="switchChecklistDay('${type}','${d.key}')">${d.label}${isToday ? '<span class="today-dot"></span>' : ''}</button>`;
  }).join('');
}

// 요일 탭 클릭 시 활성 요일을 변경하고 해당 요일의 체크리스트를 렌더링합니다.
function switchChecklistDay(type, day) {
  checklistActiveDay[type] = day;
  if (!checklistState[type][day]) {
    checklistState[type][day] = loadChecklistState(type, day);
  }
  renderDayTabs(type);
  renderChecklist(type);
}

// 현재 활성 요일의 체크리스트 항목들을 섹션별로 렌더링하고 진행률을 업데이트합니다.
// 체크된 항목은 목록에서 숨기고 하단 완료 칩 영역으로 이동합니다.
function renderChecklist(type) {
  const day = checklistActiveDay[type];
  const wrap = document.getElementById('sections-' + type);
  const data = checklistData[type][day] || [];

  // 주말 공유 안내 배너
  const isWeekend = (day === 'sat' || day === 'sun');
  const weekendBanner = isWeekend
    ? `<div style="margin-bottom:1rem;padding:10px 14px;background:#fffbf0;border:1px solid #f0e5c0;border-radius:10px;font-size:13px;color:#7a5c00;">
        🔒 주말은 운영하지 않아요. 오픈·마감 체크리스트가 동일하게 표시됩니다.
       </div>`
    : '';

  if (!data.length) {
    wrap.innerHTML = weekendBanner + '<div class="empty">이 요일에는 체크리스트 항목이 없어요</div>';
    updateChecklistProgress(type, 0, 0);
    renderChecklistDone(type);
    return;
  }

  let total = 0, checked = 0;
  const state = checklistState[type][day] || {};

  // 미완료 항목만 섹션에 렌더링 (체크된 항목은 제외)
  const sectionsHtml = data.map((section, sIdx) => {
    const uncheckedItems = section.items
      .map((label, iIdx) => ({ label, id: `${sIdx}-${iIdx}` }))
      .filter(it => !state[it.id]);

    total += section.items.length;
    checked += section.items.length - uncheckedItems.length;

    if (!uncheckedItems.length) return '';

    const itemsHtml = uncheckedItems.map(it =>
      `<div class="item" id="cl-item-${type}-${it.id}" onclick="toggleChecklistItem('${type}','${it.id}')">
        <div class="checkbox">${CHECK_ICON}</div>
        <div class="item-label">${it.label}</div>
      </div>`
    ).join('');

    return `<div class="section">
      <div class="section-title">${section.title}</div>
      <div class="card">${itemsHtml}</div>
    </div>`;
  }).join('');

  wrap.innerHTML = weekendBanner + (sectionsHtml || '');
  updateChecklistProgress(type, checked, total);
  renderChecklistDone(type);
}

// 완료된 체크리스트 항목을 하단 칩 목록으로 렌더링합니다.
// 칩을 클릭하면 다시 미완료 상태로 되돌립니다.
function renderChecklistDone(type) {
  const day = checklistActiveDay[type];
  const data = checklistData[type][day] || [];
  const state = checklistState[type][day] || {};
  const doneSection = document.getElementById('done-section-' + type);
  const doneList = document.getElementById('done-list-' + type);

  const doneItems = [];
  data.forEach((section, sIdx) => {
    section.items.forEach((label, iIdx) => {
      const id = `${sIdx}-${iIdx}`;
      if (state[id]) doneItems.push({ label, id });
    });
  });

  if (!doneItems.length) {
    doneSection.style.display = 'none';
    return;
  }
  doneSection.style.display = '';
  doneList.innerHTML = `<div class="done-chips">
    ${doneItems.map(it =>
      `<span class="done-chip" onclick="toggleChecklistItem('${type}','${it.id}')">${it.label} <span class="undo-icon">↺</span></span>`
    ).join('')}
  </div>`;
}

// 체크리스트 항목을 체크(완료)하면 애니메이션 후 사라지고 완료 칩으로 이동합니다.
// 완료 칩을 클릭하면 즉시 목록으로 되돌립니다.
function toggleChecklistItem(type, id) {
  const day = checklistActiveDay[type];
  if (!checklistState[type][day]) checklistState[type][day] = {};
  const wasChecked = !!checklistState[type][day][id];

  if (!wasChecked) {
    // 미완료 → 완료: 항목에 removing 애니메이션 적용 후 상태 변경
    const el = document.getElementById('cl-item-' + type + '-' + id);
    if (el) {
      el.classList.add('removing');
      setTimeout(() => {
        checklistState[type][day][id] = true;
        saveChecklistState(type, day);
        renderChecklist(type);
      }, 180);
      return;
    }
  }

  // 완료 → 미완료: 즉시 되돌리기
  checklistState[type][day][id] = false;
  saveChecklistState(type, day);
  renderChecklist(type);
}

// 체크리스트 진행률 바와 텍스트(n/total)를 업데이트합니다.
function updateChecklistProgress(type, checked, total) {
  const pct = total ? Math.round((checked / total) * 100) : 0;
  document.getElementById('progressFill-' + type).style.width = pct + '%';
  document.getElementById('progressText-' + type).textContent = `${checked} / ${total}`;
}

// 현재 요일의 체크 상태를 모두 초기화합니다. (확인 다이얼로그 포함)
function resetChecklist(type) {
  if (!confirm('현재 요일의 체크 상태를 모두 초기화할까요?')) return;
  const day = checklistActiveDay[type];
  checklistState[type][day] = {};
  saveChecklistState(type, day);
  renderChecklist(type);
}

  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('dateLabel-inventory').textContent =
    `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} (${days[d.getDay()]}) 재고 점검`;
}

// 미확인 재고 품목을 카테고리별 그리드로 렌더링하고 진행률을 업데이트합니다.
function renderInventory() {
  const wrap = document.getElementById('inventory-sections');
  let total = 0, checked = 0;
  let html = '';

  inventoryData.forEach((cat, cIdx) => {
    const unchecked = cat.items
      .map((label, iIdx) => ({ label, id: `${cIdx}-${iIdx}` }))
      .filter(it => !inventoryState[it.id]);

    total += cat.items.length;
    checked += cat.items.length - unchecked.length;

    if (!unchecked.length) return;

    html += `<div class="section">
      <div class="section-title">${cat.category}</div>
      <div class="grid">
        ${unchecked.map(it => `
          <div class="grid-item" id="inv-${it.id}">
            <div class="grid-item-label" onclick="toggleInventoryItem('${it.id}')">
              <span class="grid-icon">📦</span>${it.label}
            </div>
            <input type="text" class="grid-input" placeholder="수량/메모"
              value="${(inventoryNotes[it.id] || '').replace(/"/g, '&quot;')}"
              onclick="event.stopPropagation()"
              oninput="updateInventoryNote('${it.id}', this.value)" />
          </div>`).join('')}
      </div>
    </div>`;
  });

  wrap.innerHTML = html || '<div class="empty">모든 품목을 확인했어요 🎉</div>';

  renderInventoryDone();
  updateInventoryProgress(checked, total);
}

// 확인 완료된 재고 품목을 하단 칩(chip) 목록으로 렌더링합니다.
function renderInventoryDone() {
  const doneSection = document.getElementById('inventory-done-section');
  const doneList = document.getElementById('inventory-done-list');
  const doneItems = [];

  inventoryData.forEach((cat, cIdx) => {
    cat.items.forEach((label, iIdx) => {
      const id = `${cIdx}-${iIdx}`;
      if (inventoryState[id]) doneItems.push({ label, id, note: inventoryNotes[id] || '' });
    });
  });

  if (!doneItems.length) {
    doneSection.style.display = 'none';
    return;
  }
  doneSection.style.display = '';
  doneList.innerHTML = `<div class="done-list">
    ${doneItems.map(it => `<span class="done-chip" onclick="toggleInventoryItem('${it.id}')">${it.label}${it.note ? ' · ' + it.note : ''} <span class="undo-icon">↺</span></span>`).join('')}
  </div>`;
}

// 특정 재고 항목의 수량/메모 입력값을 저장합니다.
function updateInventoryNote(id, value) {
  inventoryNotes[id] = value;
  saveInventoryData();
}

// 재고 항목의 확인 상태를 토글합니다. 확인 처리 시 애니메이션 후 확인완료 영역으로 이동합니다.
function toggleInventoryItem(id) {
  const wasChecked = !!inventoryState[id];
  if (!wasChecked) {
    const el = document.getElementById('inv-' + id);
    if (el) {
      el.classList.add('removing');
      setTimeout(() => {
        inventoryState[id] = true;
        saveInventoryData();
        renderInventory();
      }, 170);
      return;
    }
  }
  inventoryState[id] = !wasChecked;
  saveInventoryData();
  renderInventory();
}

// 재고표 진행률 바와 텍스트(n/total)를 업데이트합니다.
function updateInventoryProgress(checked, total) {
  const pct = total ? Math.round((checked / total) * 100) : 0;
  document.getElementById('progressFill-inventory').style.width = pct + '%';
  document.getElementById('progressText-inventory').textContent = `${checked} / ${total}`;
}

// 재고표 체크 상태와 메모를 모두 초기화합니다. (확인 다이얼로그 포함)
function resetInventory() {
  if (!confirm('재고표 체크 상태와 메모를 모두 초기화할까요?')) return;
  inventoryState = {};
  inventoryNotes = {};
  saveInventoryData();
  renderInventory();
}

{
  const loaded = loadInventoryData();
  inventoryState = loaded.checked;
  inventoryNotes = loaded.notes;
}
setInventoryDateLabel();
renderInventory();


// 메인 탭(레시피/오픈/마감/재고)을 전환하고 해당 뷰만 표시합니다.
// 레시피 탭에서만 우하단 FAB 버튼 그룹을 표시합니다.
function switchTab(tab) {
  ['recipe', 'opening', 'closing', 'inventory', 'training'].forEach(t => {
    document.getElementById('view-' + t).style.display = (t === tab) ? '' : 'none';
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  document.getElementById('fabGroup').style.display = (tab === 'recipe') ? '' : 'none';
}

</script>

function getWeightedRandomCount() {
    const rand = Math.random() * 100;
    if (rand < 10) return 1;
    if (rand < 40) return 2;
    if (rand < 70) return 3;
    if (rand < 88) return 4;
    if (rand < 94) return 5;
    if (rand < 97) return 6;
    if (rand < 99) return 7;
    return 8;
}

function generateOrder() {
    const menuList = defaultMenuList.map(item => item.trim()).filter(item => item !== "");
    
    if (menuList.length === 0) {
        alert("메뉴 데이터가 비어 있습니다! 스크립트 내부의 defaultMenuList를 확인해주세요.");
        return;
    }

    const countMode = document.getElementById('countMode').value;
    let totalItems = 1;
    if (countMode === "random") {
        totalItems = getWeightedRandomCount(); 
    } else {
        totalItems = parseInt(countMode);
    }

    const orderMap = {};

    for (let i = 0; i < totalItems; i++) {
        const randomIndex = Math.floor(Math.random() * menuList.length);
        const selectedMenuLine = menuList[randomIndex];
        
        if (orderMap[selectedMenuLine]) {
            orderMap[selectedMenuLine].count += 1;
        } else {
            orderMap[selectedMenuLine] = {
                name: selectedMenuLine,
                count: 1
            };
        }
    }

    const orderNum = Math.floor(Math.random() * 900) + 100;
    let htmlContent = `<div style="text-align:center; margin-bottom:10px; font-size:13px; font-weight:bold; color:#555;">주문번호: # ${orderNum} (총 ${totalItems}잔)</div>`;

    for (const key in orderMap) {
        const item = orderMap[key];
        htmlContent += `
            <div class="order-block">
                <div class="receipt-item">
                    <span>▶ ${item.name}</span>
                    <span class="item-count">${item.count} ➔</span>
                </div>
            </div>
        `;
    }
    
    htmlContent += `
        <div style="border-top:1px dashed #333; margin-top:10px; padding-top:6px; text-align:right; font-size:11px; color:#666;">
            동선을 최적화해서 빠르게 제조해보세요!
        </div>
    `;
    
    document.getElementById('receiptBody').innerHTML = htmlContent;
}

window.generateOrder = generateOrder;
})();
</script>

const TABS_PER_PAGE = 12;
let currentTabKey = tabOrder[0].key;
let currentPage = 0;
let currentTabPage = 0; // 탭 페이지 (0 = 탭1~12, 1 = 탭13~24)
let quizMode = false;

function getCurrentTab() {
  return tabOrder.find(t => t.key === currentTabKey);
}

function changePage(dir) {
  const tab = getCurrentTab();
  currentPage = Math.max(0, Math.min(tab.pages.length - 1, currentPage + dir));
  renderGrid();
}

function renderTabs() {
  const el = document.getElementById("tabs");
  const start = currentTabPage * TABS_PER_PAGE;
  const visible = tabOrder.slice(start, start + TABS_PER_PAGE);

  el.innerHTML = visible.map(({ key, label }) => {
    const isActive = key === currentTabKey ? 'active' : '';
    const labelHtml = label.replace(/\n/g, '<br>');
    return `<button class="tab ${isActive}" data-cat="${key}">${labelHtml}</button>`;
  }).join("");
  el.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => selectTab(btn.dataset.cat));
  });

  // 탭 네비 버튼 상태 업데이트 (탭 페이지 기준)
  const tabPageCount = Math.ceil(tabOrder.length / TABS_PER_PAGE);
  const tabPrev = document.getElementById("tab-prev");
  const tabNext = document.getElementById("tab-next");
  if (tabPrev) tabPrev.disabled = (currentTabPage === 0);
  if (tabNext) tabNext.disabled = (currentTabPage >= tabPageCount - 1);
}

function changeTab(dir) {
  const tabPageCount = Math.ceil(tabOrder.length / TABS_PER_PAGE);
  currentTabPage = Math.max(0, Math.min(tabPageCount - 1, currentTabPage + dir));
  // 탭 페이지 바뀌면 해당 페이지 첫 탭 선택
  const start = currentTabPage * TABS_PER_PAGE;
  currentTabKey = tabOrder[start].key;
  currentPage = 0;
  renderTabs();
  renderGrid();
}

function renderGrid() {
  const tab = getCurrentTab();
  const total = tab.pages.length;

  // 화살표 상태
  const btnPrev = document.getElementById("btn-prev");
  const btnNext = document.getElementById("btn-next");
  
  btnPrev.disabled = (currentPage === 0 || total <= 1);
  btnNext.disabled = (currentPage === total - 1 || total <= 1);
  btnPrev.style.opacity = '1';
  btnNext.style.opacity = '1';

  const el = document.getElementById("grid");

  // 이 탭의 모든 페이지 중 최대 행 수 계산 (빈 탭도 기준 높이 유지)
  const COLS = 6;
  let maxRows = 6; // 기본 높이 (대부분의 탭이 5~6행 정도이므로)

  if (total > 0) {
    tab.pages.forEach(pageKey => {
      const pageItems = categories[pageKey] || [];
      const len = pageItems.length % COLS === 0 ? pageItems.length : pageItems.length + (COLS - pageItems.length % COLS);
      maxRows = Math.max(maxRows, Math.ceil(len / COLS));
    });
  }

  const targetLen = maxRows * COLS;

  // 빈 탭 처리
  if (total === 0) {
    el.innerHTML = Array(targetLen).fill(0).map(() => 
      `<div class="cell empty"></div>`
    ).join("");
    return;
  }

  // 정상 탭 처리
  const dataKey = tab.pages[currentPage];
  const items = categories[dataKey] || [];

  const padded = [...items];
  while (padded.length < targetLen) padded.push(null);

  el.innerHTML = padded.map(item => {
    if (!item) return `<div class="cell empty"></div>`;
    const typeClass = item.type || "";
    const priceStr = item.price.toLocaleString();
    const safeName = item.name.replace(/"/g, '&quot;');
    const safePrice = item.price;
    return `<div class="cell ${typeClass}" data-name="${safeName}" data-price="${safePrice}" onclick="addToOrder('${safeName}', ${safePrice})">
      <div class="cell-name">${item.name}</div>
      <div class="cell-price">${priceStr}</div>
    </div>`;
  }).join("");
}

function selectTab(cat) {
  currentTabKey = cat;
  currentPage = 0;
  renderTabs();
  renderGrid();
}

function toggleQuiz() {
  quizMode = !quizMode;
  document.body.classList.toggle("quiz-mode", quizMode);
  document.querySelector(".btn-quiz").textContent = quizMode ? "👁 이름 보이기" : "🧠 이름 가리기 (퀴즈 모드)";
}

function resetQuiz() {
  quizMode = false;
  document.body.classList.remove("quiz-mode");
  document.querySelector(".btn-quiz").textContent = "🧠 이름 가리기 (퀴즈 모드)";
}

renderTabs();
renderGrid();

// ===== 주문 관리 =====
let orderItems = [];    // {name, price, qty}
let selectedOrderIdx = -1;

function addToOrder(name, price) {
  // HTML 엔티티 디코딩
  const decoded = name.replace(/&lt;br&gt;/gi, ' ').replace(/&amp;/g, '&').replace(/&quot;/g, '"');
  
  // ★★★ 항상 새로운 항목으로 추가 (수량 합치지 않음)
  orderItems.push({ name: decoded, price, qty: 1 });
  
  renderOrder();
}

function renderOrder() {
  const el = document.getElementById("order-list");
  if (orderItems.length === 0) {
    el.innerHTML = '';
    selectedOrderIdx = -1;
  } else {
    el.innerHTML = orderItems.map((o, i) => {
      const sel = i === selectedOrderIdx ? 'selected' : '';
      return `<div class="order-row ${sel}" onclick="selectOrder(${i})">
        <span class="o-seq">${i + 1}</span>
        <span class="o-name">${o.name}</span>
        <span class="o-qty">${o.qty}</span>
        <span class="o-price">${(o.price * o.qty).toLocaleString()}</span>
      </div>`;
    }).join("");
  }
  updateAmounts();
}

function selectOrder(idx) {
  selectedOrderIdx = idx;
  renderOrder();
}

function updateAmounts() {
  const totalQty = orderItems.reduce((s, o) => s + o.qty, 0);
  const totalAmt = orderItems.reduce((s, o) => s + o.price * o.qty, 0);
  document.getElementById("amt-order").textContent = totalAmt.toLocaleString();
  document.getElementById("amt-bill").textContent = totalAmt.toLocaleString();
  document.getElementById("amt-qty").textContent = totalQty;
  document.getElementById("amt-service").textContent = "0";
  document.getElementById("amt-discount").textContent = "0";
  document.getElementById("amt-tip").textContent = "0";
}

function cancelSelected() {
  if (selectedOrderIdx < 0 || selectedOrderIdx >= orderItems.length) return;
  orderItems.splice(selectedOrderIdx, 1);
  selectedOrderIdx = Math.min(selectedOrderIdx, orderItems.length - 1);
  if (orderItems.length === 0) selectedOrderIdx = -1;
  renderOrder();
}

function clearOrder() {
  orderItems = [];
  selectedOrderIdx = -1;
  renderOrder();
}

function changeQty(dir) {
  if (selectedOrderIdx < 0 || selectedOrderIdx >= orderItems.length) return;
  orderItems[selectedOrderIdx].qty += dir;
  if (orderItems[selectedOrderIdx].qty <= 0) {
    orderItems.splice(selectedOrderIdx, 1);
    selectedOrderIdx = Math.min(selectedOrderIdx, orderItems.length - 1);
    if (orderItems.length === 0) selectedOrderIdx = -1;
  }
  renderOrder();
}

function moveSelectedUp() {
  if (selectedOrderIdx <= 0) return;
  [orderItems[selectedOrderIdx - 1], orderItems[selectedOrderIdx]] =
    [orderItems[selectedOrderIdx], orderItems[selectedOrderIdx - 1]];
  selectedOrderIdx--;
  renderOrder();
}

function moveSelectedDown() {
  if (selectedOrderIdx < 0 || selectedOrderIdx >= orderItems.length - 1) return;
  [orderItems[selectedOrderIdx + 1], orderItems[selectedOrderIdx]] =
    [orderItems[selectedOrderIdx], orderItems[selectedOrderIdx + 1]];
  selectedOrderIdx++;
  renderOrder();
}

window.addToOrder = addToOrder;
window.selectOrder = selectOrder;
window.cancelSelected = cancelSelected;
window.clearOrder = clearOrder;
window.changeQty = changeQty;
window.changeTab = changeTab;
window.changePage = changePage;
window.toggleQuiz = toggleQuiz;
window.resetQuiz = resetQuiz;
window.moveSelectedUp = moveSelectedUp;
window.moveSelectedDown = moveSelectedDown;
})();

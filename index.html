<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blueport 레시피 검색</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a1a; min-height: 100vh; }
  .container { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem; }
  .brand { font-size: 12px; color: #999; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-size: 26px; font-weight: 600; color: #1a1a1a; margin-bottom: 1.5rem; }
  .search-row { display: flex; gap: 8px; margin-bottom: 1rem; }
  .search-row input {
    flex: 1; padding: 10px 14px; font-size: 15px;
    border: 1px solid #ddd; border-radius: 10px;
    background: #fff; outline: none; transition: border 0.15s;
  }
  .search-row input:focus { border-color: #aaa; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .chip {
    font-size: 13px; padding: 5px 12px; border-radius: 99px;
    border: 1px solid #ddd; color: #666; background: #fff;
    cursor: pointer; transition: all 0.15s;
  }
  .chip:hover { background: #f0ede8; border-color: #bbb; color: #333; }
  .chip.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .results { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: #fff; border: 1px solid #e8e5e0;
    border-radius: 14px; padding: 1rem 1.25rem;
  }
  .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .cat-badge { font-size: 11px; padding: 3px 9px; border-radius: 99px; font-weight: 600; }
  .cat-커피        { background: #FEF3C7; color: #92400E; }
  .cat-논커피      { background: #D1FAE5; color: #065F46; }
  .cat-에이드주스  { background: #FFE4E6; color: #9F1239; }
  .cat-스무디프라페{ background: #EDE9FE; color: #5B21B6; }
  .cat-베이스      { background: #E0F2FE; color: #075985; }
  .base-recipe-block {
    border: 1px solid #f0ede8; border-radius: 10px;
    padding: 12px 14px; background: #fafaf8;
    font-size: 13px; color: #333; line-height: 1.7;
  }
  .base-recipe-label {
    font-size: 11px; font-weight: 700; color: #aaa;
    letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .menu-name { font-size: 16px; font-weight: 600; color: #1a1a1a; }
  .size-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .size-block { border: 1px solid #f0ede8; border-radius: 10px; padding: 10px 12px; background: #fafaf8; }
  .size-label { font-size: 11px; font-weight: 700; color: #aaa; margin-bottom: 8px; letter-spacing: 0.06em; }
  .reset-btn {
    padding: 10px 14px; font-size: 13px; font-weight: 600;
    border: 1px solid #ddd; border-radius: 10px;
    background: #fff; color: #666; cursor: pointer; transition: all 0.15s;
    white-space: nowrap;
  }
  .reset-btn:hover { background: #f0ede8; border-color: #bbb; color: #333; }
  .temp-row {
    margin-bottom: 5px; cursor: pointer; border-radius: 6px; padding: 2px 4px; transition: background 0.12s;
    display: flex; align-items: flex-start; gap: 6px;
  }
  .temp-row:hover { background: #f5f4f0; }
  .temp-row.focused { background: transparent; }
  .card.dimmed { opacity: 0.25; cursor: pointer; }
  .size-block.dimmed { opacity: 0.2; }
  .size-block.focused-block {
    border-color: #1a1a1a;
    grid-column: 1 / -1;
    padding: 16px 20px;
  }
  .size-block.focused-block .size-label { font-size: 13px; margin-bottom: 12px; color: #555; }
  .size-block.focused-block .recipe-text { font-size: 14px; color: #1a1a1a; }
  .size-block.focused-block .temp-tag { font-size: 12px; padding: 3px 8px; }
  .size-block.focused-block .temp-row { margin-bottom: 0; }
  .back-btn {
    display: none; margin-bottom: 1rem;
    padding: 8px 16px; font-size: 13px; font-weight: 600;
    border: 1px solid #ddd; border-radius: 10px;
    background: #fff; color: #444; cursor: pointer; transition: all 0.15s;
  }
  .back-btn:hover { background: #f0ede8; }
  .back-btn.visible { display: inline-flex; align-items: center; gap: 6px; }
  .temp-tag {
    font-size: 10px; font-weight: 700; padding: 2px 6px;
    border-radius: 4px; display: inline-block; vertical-align: middle;
    flex-shrink: 0; white-space: nowrap;
  }
  .hot-tag { background: #FEE2E2; color: #B91C1C; }
  .ice-tag { background: #DBEAFE; color: #1D4ED8; }
  .recipe-text { font-size: 12px; color: #555; line-height: 1.55; flex: 1; min-width: 0; }
  .none-text { font-size: 12px; color: #ccc; }
  .note-bar { margin-top: 10px; padding: 7px 10px; background: #fffbf0; border: 1px solid #f0e5c0; border-radius: 8px; font-size: 12px; color: #7a5c00; }
  .note-label { font-weight: 700; margin-right: 4px; }
  .empty { text-align: center; padding: 4rem 0; color: #aaa; font-size: 15px; }
  .tab-bar {
    display: flex; gap: 4px; margin-bottom: 1.75rem;
    border-bottom: 1px solid #e8e5e0;
  }
  .tab-item {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 8px 13px; font-size: 13.5px; font-weight: 600;
    color: #999; text-decoration: none; background: none; border: none;
    position: relative; cursor: pointer; transition: color 0.15s;
  }
  .tab-item .tab-icon { font-size: 15px; opacity: 0.8; }
  .tab-item:hover { color: #444; }
  .tab-item.active {
    color: #1a1a1a;
  }
  .tab-item.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: #1a1a1a; border-radius: 2px 2px 0 0;
  }
  @media (max-width: 500px) {
    .tab-item { font-size: 12px; padding: 10px 4px 12px; }
    .tab-item .tab-icon { font-size: 14px; }
  }
  /* 우하단 고정 버튼 그룹 */
  .fab-group {
    position: fixed; bottom: 24px; right: 20px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 100;
  }
  .fab {
    width: 48px; height: 48px;
    border-radius: 50%; border: 1px solid #ddd;
    background: #fff; color: #444;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: all 0.15s;
  }
  .fab:hover { background: #f0ede8; border-color: #bbb; }
  .fab:active { transform: scale(0.93); }
  .fab.disabled { opacity: 0.3; pointer-events: none; }
  @media (max-width: 500px) {
    .size-grid { grid-template-columns: 1fr; }
    .temp-row { flex-direction: column; gap: 3px; align-items: flex-start; }
    .recipe-text { display: block; }
  }
  /* 체크리스트 탭 전용 스타일 (네임스페이스로 분리하여 레시피 카드와 충돌 방지) */
  .checklist-page h1 { margin-bottom: 0.4rem; }
  .checklist-page .subtitle { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
  .checklist-page .progress-wrap {
    background: #fff; border: 1px solid #e8e5e0; border-radius: 14px;
    padding: 14px 16px; margin-bottom: 1.25rem;
    display: flex; align-items: center; gap: 12px;
  }
  .checklist-page .progress-track {
    flex: 1; height: 8px; background: #f0ede8; border-radius: 99px; overflow: hidden;
  }
  .checklist-page .progress-fill {
    height: 100%; background: #1a1a1a; border-radius: 99px;
    width: 0%; transition: width 0.25s ease;
  }
  .checklist-page .progress-text { font-size: 13px; font-weight: 600; color: #444; white-space: nowrap; }
  .checklist-page .top-actions { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .checklist-page .section { margin-bottom: 1.5rem; }
  .checklist-page .section-title {
    font-size: 13px; font-weight: 700; color: #999;
    letter-spacing: 0.04em; margin-bottom: 8px; padding-left: 2px;
  }
  .checklist-page .card {
    background: #fff; border: 1px solid #e8e5e0;
    border-radius: 14px; overflow: hidden;
  }
  .checklist-page .item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; border-bottom: 1px solid #f0ede8;
    cursor: pointer; user-select: none; transition: background 0.12s;
  }
  .checklist-page .item:last-child { border-bottom: none; }
  .checklist-page .item:hover { background: #faf9f6; }
  .checklist-page .checkbox {
    width: 22px; height: 22px; flex-shrink: 0; border-radius: 7px;
    border: 1.5px solid #ccc; background: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .checklist-page .checkbox svg { width: 13px; height: 13px; opacity: 0; transition: opacity 0.1s; }
  .checklist-page .item.checked .checkbox { background: #1a1a1a; border-color: #1a1a1a; }
  .checklist-page .item.checked .checkbox svg { opacity: 1; }
  .checklist-page .item.checked .item-label { color: #aaa; text-decoration: line-through; }
  .checklist-page .item-label { font-size: 15px; color: #1a1a1a; flex: 1; line-height: 1.4; }
  .checklist-page .empty { text-align: center; padding: 4rem 0; color: #aaa; font-size: 15px; }
</style>
</head>
<body>
<div class="container">
  <div class="brand">Blueport Cafe</div>
  <div class="tab-bar">
    <button class="tab-item active" id="tab-recipe" onclick="switchTab('recipe')"><span class="tab-icon">🔍</span>레시피 검색</button>
    <button class="tab-item" id="tab-opening" onclick="switchTab('opening')"><span class="tab-icon">☀️</span>오프닝 체크리스트</button>
    <button class="tab-item" id="tab-closing" onclick="switchTab('closing')"><span class="tab-icon">🌙</span>마감 체크리스트</button>
  </div>

  <div id="view-recipe">
  <h1>레시피 검색</h1>
  <div class="search-row">
    <input type="text" id="q" placeholder="메뉴명 또는 초성 검색 (예: ㄱㄱㅁㄹㄸ)" oninput="render()" onkeydown="handleEnter(event)" />
    <button class="reset-btn" onclick="resetAll()">↺ 초기화</button>
  </div>
  <div class="chips">
    <button class="chip active" onclick="setFilter('전체')">전체</button>
    <button class="chip" onclick="setFilter('커피')">커피</button>
    <button class="chip" onclick="setFilter('논커피')">논커피</button>
    <button class="chip" onclick="setFilter('에이드/주스')">에이드/주스</button>
    <button class="chip" onclick="setFilter('스무디/프라페')">스무디/프라페</button>
    <button class="chip" onclick="setFilter('베이스')">베이스</button>
  </div>
  <button class="back-btn" id="backBtn" onclick="clearFocus()">← 결과로 돌아가기</button>
  <div class="results" id="results"></div>
  </div>

  <div id="view-opening" class="checklist-page" style="display:none;">
    <h1>오프닝 체크리스트</h1>
    <div class="subtitle" id="dateLabel-opening"></div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill-opening"></div></div>
      <div class="progress-text" id="progressText-opening">0 / 0</div>
    </div>
    <div class="top-actions">
      <button class="reset-btn" onclick="resetChecklist('opening')">↺ 전체 초기화</button>
    </div>
    <div id="sections-opening"></div>
  </div>

  <div id="view-closing" class="checklist-page" style="display:none;">
    <h1>마감 체크리스트</h1>
    <div class="subtitle" id="dateLabel-closing"></div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill-closing"></div></div>
      <div class="progress-text" id="progressText-closing">0 / 0</div>
    </div>
    <div class="top-actions">
      <button class="reset-btn" onclick="resetChecklist('closing')">↺ 전체 초기화</button>
    </div>
    <div id="sections-closing"></div>
  </div>
</div>

<!-- 우하단 고정 버튼 그룹 (레시피 검색 탭에서만 표시) -->
<div class="fab-group" id="fabGroup">
  <button class="fab" id="fabUndo" onclick="undoReset()" title="되돌리기">↩</button>
  <button class="fab" id="fabReset" onclick="fabResetAll()" title="초기화 후 검색">↺</button>
  <button class="fab" onclick="fabSearch()" title="검색">🔍</button>
</div>

<script>
const menus = [
  { name: "아메리카노", cat: "커피",
    R: { hot: "온수 1번 + 샷 2", ice: "정수 1번 + 얼음 + 샷 2" },
    L: { hot: "온수 2번 + 샷 3", ice: "정수 2번 + 얼음 + 샷 3" },
    D: { hot: "온수 2번 + 샷 4", ice: "정수 2번 + 얼음 + 샷 4" } },
  { name: "카페라떼", cat: "커피",
    R: { hot: "샷 2 + 스팀밀크", ice: "우유(주전자 절반) + 얼음 + 샷 2" },
    L: { hot: "샷 3 + 스팀밀크", ice: "우유(주전자 절반) + 얼음 + 샷 3" },
    D: { hot: "샷 4 + 스팀밀크", ice: "얼음가득 + 우유 + 샷 4" } },

    L: { hot: "해당시럽 3p + 카페라떼 L", ice: "해당시럽 3p + 아이스라떼 L" },
    D: { hot: "해당시럽 3p + 설탕시럽 1p + 카페라떼 D", ice: "해당시럽 3p + 설탕시럽 1p + 아이스라떼 D" } },
  { name: "카푸치노", cat: "커피", note: "+ 시나몬파우더(선택)",
    R: { hot: "카페라떼 R(우유적게) + 우유거품 가득", ice: "아이스라떼 R(우유적게) + 우유거품 가득 + 시나몬파우더(선택)" },
    L: { hot: "카페라떼 L(우유적게) + 우유거품 가득", ice: "아이스라떼 L(우유적게) + 우유거품 가득" },
    D: { hot: "카페라떼 D(우유적게) + 우유거품 가득", ice: "아이스라떼 D(우유적게) + 우유거품 가득" } },
  { name: "카라멜 마끼아또", cat: "커피", note: "+ 우유거품 + 카라멜드리즐",

    L: { hot: "카라멜소스 1p + 카라멜시럽 2p + 샷 3 + 스팀밀크", ice: "섞기[카라멜소스 1p + 카라멜시럽 2p + 샷 3]<br/>+ 우유(주전자 끝) + 얼음" },
    D: { hot: "카라멜소스 1p + 카라멜시럽 3p + 샷 4 + 스팀밀크", ice: "섞기[카라멜소스 1p + 카라멜시럽 3p + 샷 4]<br/>+ 얼음가득 + 우유" } },
  { name: "카페모카 (다크)", cat: "커피", note: "+ 휘핑(선택) + 초코드리즐",

    L: { hot: "초코소스 1p + 초코파우더 1s + 카페라떼 L", ice: "섞기[초코소스 1p + 초코파우더 1s + 샷3]<br/>+ 우유(주전자 끝) + 얼음" },

  { name: "카페모카 (카라멜)", cat: "커피", note: "+ 휘핑(선택) + 카라멜드리즐",

    L: { hot: "카라멜소스 1p + 초코파우더 1s + 카페라떼 L", ice: "섞기[카라멜소스 1p + 초코파우더 1s]<br/>+ 우유(주전자 끝) + 얼음" },

    L: { hot: "뜨아 L + 크림베이스 2스푼", ice: "아아 L + 크림베이스 2스푼" },
    D: { hot: "-", ice: "-" } },
  { name: "아인슈페너 라떼", cat: "커피", note: "+ 초코파우더(토핑)",

    L: { hot: "카페라떼 L + 크림베이스 2스푼", ice: "아이스라떼 L + 크림베이스 2스푼" },
    D: { hot: "-", ice: "-" } },
  { name: "아인슈페너 초코", cat: "커피", note: "+ 초코파우더(토핑)",
    R: { hot: "초코파우더 2s + 스팀밀크 + 크림베이스 2s", ice: "초코베이스(주전자 절반) + 얼음 + 크림베이스 2s" },
    L: { hot: "초코파우더 3s + 스팀밀크 + 크림베이스 2s", ice: "초코베이스(주전자 절반) + 얼음 + 크림베이스 2s" },

let activeFilter = '전체';

// ─── 초성 검색 ───────────────────────────────────────────────
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

// 겹받침(복합 자모) → 낱자 두 개로 분해
// 예: ㄻ(U+11B1) → ㄹㅁ, ㄳ → ㄱㅅ 등
const DOUBLE_JAMO = {
  'ㄳ': 'ㄱㅅ', 'ㄵ': 'ㄴㅈ', 'ㄶ': 'ㄴㅎ',
  'ㄺ': 'ㄹㄱ', 'ㄻ': 'ㄹㅁ', 'ㄼ': 'ㄹㅂ',
  'ㄽ': 'ㄹㅅ', 'ㄾ': 'ㄹㅌ', 'ㄿ': 'ㄹㅍ',
  'ㅀ': 'ㄹㅎ', 'ㅄ': 'ㅂㅅ',
};

// NFC 조합된 겹받침 자모를 낱자로 풀기
function decomposeDoubleJamo(str) {
  return [...str].map(ch => DOUBLE_JAMO[ch] || ch).join('');
}

function getChosung(str) {
  return [...str].map(ch => {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code < 0 || code > 11171) return ch;
    return CHO[Math.floor(code / (21 * 28))];
  }).join('');
}

// 낱자 자음(초성 + 겹받침 분해 후 낱자)인지 확인
const ALL_JAMO = new Set([...CHO, ...Object.keys(DOUBLE_JAMO)]);
function isChosungOnly(str) {
  return [...str].every(ch => ALL_JAMO.has(ch) || /\s/.test(ch));
}

function matchesChosung(menu, query) {
  // 겹받침 분해 후 비교 (예: ㄻ → ㄹㅁ)
  const cleanedQuery = decomposeDoubleJamo(query.replace(/\s/g, ''));
  const tokens = buildSearchTokens(menu.name);
  return tokens.some(tok => getChosung(tok).includes(cleanedQuery));
}
// ─────────────────────────────────────────────────────────────

// 엔터 누르면 모바일 키보드 내리기
function handleEnter(e) {
  if (e.key === 'Enter') {
    e.target.blur();
  }
}



function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === f));
  render();
}

function catKey(cat) {
  return cat.replace(/[\/\s]/g, '');
}

function parseQuery(raw) {
  const tokens = raw.trim().toLowerCase().split(/\s+/);
  const sizeKeywords = { r: 'R', l: 'L', d: 'D' };
  // partial prefix match: 아 -> 아이스, h -> hot, ic -> ice 등
  function matchTemp(t) {
    if ('hot'.startsWith(t) || '핫'.startsWith(t)) return 'hot';
    if ('ice'.startsWith(t) || 'iced'.startsWith(t) || '아이스'.startsWith(t)) return 'ice';
    return null;
  }

  let sizes = [], temps = [], nameTokens = [];
  tokens.forEach(t => {
    if (sizeKeywords[t]) sizes.push(sizeKeywords[t]);
    else if (t.length >= 1 && matchTemp(t)) temps.push(matchTemp(t));
    else if (t) nameTokens.push(t);
  });
  return {
    name: nameTokens.join(' '),
    sizes: sizes.length ? sizes : ['R', 'L', 'D'],
    temps: temps.length ? temps : ['hot', 'ice'],
  };
}

// 메뉴명에서 검색 가능한 키워드 토큰 목록을 생성
// 예: "카페라떼 (바닐라/카라멜/헤이즐넛)" → ["카페라떼", "바닐라카페라떼", "카라멜카페라떼", "헤이즐넛카페라떼", "바닐라라떼", "카라멜라떼", "헤이즐넛라떼"]
// 예: "수제차 (유자/레몬/자몽/대추/진저)" → ["수제차", "유자차", "레몬차", "자몽차", "대추차", "진저차", "유자수제차", ...]
function buildSearchTokens(menuName) {
  const lower = menuName.toLowerCase().replace(/\s/g, '');
  const tokens = [lower];

  // 괄호 안의 옵션 추출
  const parenMatch = menuName.match(/\(([^)]+)\)/);
  if (parenMatch) {
    const options = parenMatch[1].split('/').map(o => o.trim().toLowerCase().replace(/\s/g, ''));
    const baseName = menuName.replace(/\s*\([^)]+\)/, '').toLowerCase().replace(/\s/g, '');

    options.forEach(opt => {
      // 옵션 단독 (예: "헤이즐넛")
      tokens.push(opt);
      // 옵션 + 베이스명 (예: "헤이즐넛카페라떼")
      tokens.push(opt + baseName);
      // 베이스명 + 옵션 (예: "카페라떼헤이즐넛")
      tokens.push(baseName + opt);

      // 베이스명에서 공통 접미사 추출해서 조합 (예: "라떼", "차", "티" 등)
      const suffixes = ['라떼', '차', '티', '에이드', '주스', '스무디', '프라페', '요거트'];
      suffixes.forEach(suf => {
        if (baseName.endsWith(suf)) {
          // 옵션 + 접미사 (예: "레몬차", "헤이즐넛라떼")
          tokens.push(opt + suf);
        }
      });
    });
  }

  return tokens;
}

// 섞기[...], 블렌더 N번[...] 패턴에서 레이블(대괄호 포함)만 굵게, 내용은 일반 텍스트로
function formatRecipe(text) {
  return text.replace(/((?:블렌더\s*\d*번?|섞기)\s*)\[([^\]]+)\]/g, (_, label, content) => {
    return `<b>${label.trim()}[</b>${content}<b>]</b>`;
  });
}

// 검색어가 메뉴 토큰 중 하나에 포함되는지, 또는 메뉴 토큰이 검색어를 포함하는지 확인
// 초성만 입력된 경우 초성 검색도 지원
function matchesSearch(menu, nameNoSpace) {
  if (!nameNoSpace) return true;

  // 초성만 입력된 경우 → 초성 검색
  if (isChosungOnly(nameNoSpace)) {
    return matchesChosung(menu, nameNoSpace);
  }

  const searchLower = nameNoSpace.toLowerCase();
  const tokens = buildSearchTokens(menu.name);
  return tokens.some(tok => tok.includes(searchLower) || searchLower.includes(tok));
}

function render() {
  const raw = document.getElementById('q').value;
  const { name, sizes, temps } = parseQuery(raw);
  // 메뉴명 띄어쓰기 무시: 검색어와 메뉴명 모두 공백 제거 후 비교
  const nameNoSpace = name.replace(/\s/g, '');

  const filtered = menus.filter(m => {
    const matchName = matchesSearch(m, nameNoSpace);
    const matchCat = activeFilter === '전체' || m.cat === activeFilter;
    if (m.cat === '베이스') return matchName && matchCat;
    const hasData = sizes.some(s => temps.some(t => m[s][t] !== '-'));
    return matchName && matchCat && (raw.trim() === '' || hasData);
  });

  const el = document.getElementById('results');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty">검색 결과가 없어요 🔍</div>';
    return;
  }

  el.innerHTML = filtered.map(m => {
    const ck = catKey(m.cat);

    // 베이스 카테고리: 사이즈/온도 없이 단일 블록 + 비고는 별도 표시
    if (m.cat === '베이스') {
      const noteHtml = m.note ? `<div class="note-bar"><span class="note-label">📌 비고</span>${m.note}</div>` : '';
      const storageText = m.storage || '냉장보관';
      const recipeText = m.recipe || '';
      return `<div class="card">
        <div class="card-header">
          <span class="cat-badge cat-${ck}">${m.cat}</span>
          <span class="menu-name">${m.name}</span>
        </div>
        <div class="base-recipe-block">
          <div class="base-recipe-label">🧊 ${storageText}</div>
          ${recipeText ? `<div style="font-size:13px;color:#333;line-height:1.7;">${recipeText}</div>` : ''}
        </div>
        ${noteHtml}
      </div>`;
    }

    const sizeBlocks = sizes.map(s => {
      const d = m[s];
      const hotLine = temps.includes('hot') && d.hot !== '-'
        ? `<div class="temp-row" onclick="focusRecipe(this)""><span class="temp-tag hot-tag">HOT</span><span class="recipe-text">${formatRecipe(d.hot)}</span></div>`
        : '';
      const iceLine = temps.includes('ice') && d.ice !== '-'
        ? `<div class="temp-row" onclick="focusRecipe(this)"><span class="temp-tag ice-tag">ICE</span><span class="recipe-text">${formatRecipe(d.ice)}</span></div>`
        : '';
      const content = hotLine + iceLine || '<span class="none-text">해당 없음</span>';
      return `<div class="size-block">
        <div class="size-label">${s} 사이즈</div>
        ${content}
      </div>`;
    }).join('');

    const noteHtml = m.note ? `<div class="note-bar"><span class="note-label">📌 비고</span>${m.note}</div>` : '';
    return `<div class="card">
      <div class="card-header">
        <span class="cat-badge cat-${ck}">${m.cat}</span>
        <span class="menu-name">${m.name}</span>
      </div>
      <div class="size-grid">${sizeBlocks}</div>
      ${noteHtml}
    </div>`;
  }).join('');
}

function resetAll() {
  document.getElementById('q').value = '';
  activeFilter = '전체';
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === '전체'));
  clearFocus();
  render();
}

let lastQuery = ''; // 되돌리기용 저장

function fabSearch() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => document.getElementById('q').focus(), 300);
}

function fabResetAll() {
  const q = document.getElementById('q');
  lastQuery = q.value;
  updateUndoBtn();
  q.value = '';
  activeFilter = '전체';
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === '전체'));
  clearFocus();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => q.focus(), 300);
}

function undoReset() {
  if (!lastQuery) return;
  const q = document.getElementById('q');
  q.value = lastQuery;
  lastQuery = '';
  updateUndoBtn();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => q.focus(), 300);
}

function updateUndoBtn() {
  const btn = document.getElementById('fabUndo');
  if (lastQuery) btn.classList.remove('disabled');
  else btn.classList.add('disabled');
}

function focusRecipe(row) {
  if (row.classList.contains('focused')) { clearFocus(); return; }
  document.querySelectorAll('.card').forEach(card => card.classList.add('dimmed'));
  document.querySelectorAll('.size-block').forEach(b => b.classList.add('dimmed'));
  const sizeBlock = row.closest('.size-block');
  const card = row.closest('.card');
  const grid = card.querySelector('.size-grid');
  card.classList.remove('dimmed');
  sizeBlock.classList.remove('dimmed');
  sizeBlock.classList.add('focused-block');
  // dimmed된 카드 클릭하면 clearFocus
  document.querySelectorAll('.card.dimmed').forEach(c => c.onclick = () => clearFocus());
  card.classList.remove('dimmed');
  sizeBlock.classList.remove('dimmed');
  sizeBlock.classList.add('focused-block');
  // 그리드를 1칸으로 바꿔서 focused-block이 전체 너비 차지
  grid._origCols = grid.style.gridTemplateColumns;
  grid.style.gridTemplateColumns = '1fr';
  card.querySelectorAll('.temp-row').forEach(r => { if (r !== row) r.style.display = 'none'; });
  card.querySelectorAll('.size-block').forEach(b => { if (b !== sizeBlock) b.style.display = 'none'; });
  row.classList.add('focused');
  document.getElementById('backBtn').classList.add('visible');
}

function clearFocus() {
  document.querySelectorAll('.card').forEach(card => {
    card.classList.remove('dimmed');
    card.onclick = null;
  });
  document.querySelectorAll('.size-block').forEach(b => {
    b.classList.remove('dimmed', 'focused-block');
    b.style.display = '';
  });
  document.querySelectorAll('.size-grid').forEach(g => {
    if (g._origCols !== undefined) { g.style.gridTemplateColumns = g._origCols; delete g._origCols; }
  });
  document.querySelectorAll('.temp-row').forEach(r => {
    r.classList.remove('focused');
    r.style.display = '';
  });
  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.classList.remove('visible');
}

render();
updateUndoBtn();

const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

const checklistState = { opening: {}, closing: {} };

function checklistTodayKey(type) {
  const d = new Date();
  return `${type}-${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function loadChecklistState(type) {
  try {
    const raw = localStorage.getItem(checklistTodayKey(type));
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

function saveChecklistState(type) {
  try { localStorage.setItem(checklistTodayKey(type), JSON.stringify(checklistState[type])); } catch (e) {}
}

function renderChecklist(type) {
  const wrap = document.getElementById('sections-' + type);
  const data = checklistData[type];

  if (!data.length) {
    wrap.innerHTML = '<div class="empty">체크리스트 항목이 없어요</div>';
    updateChecklistProgress(type, 0, 0);
    return;
  }

  let total = 0, checked = 0;

  wrap.innerHTML = data.map((section, sIdx) => {
    const itemsHtml = section.items.map((label, iIdx) => {
      const id = `${sIdx}-${iIdx}`;
      const isChecked = !!checklistState[type][id];
      total++;
      if (isChecked) checked++;
      return `<div class="item ${isChecked ? 'checked' : ''}" onclick="toggleChecklistItem('${type}','${id}')">
        <div class="checkbox">${CHECK_ICON}</div>
        <div class="item-label">${label}</div>
      </div>`;
    }).join('');

    return `<div class="section">
      <div class="section-title">${section.title}</div>
      <div class="card">${itemsHtml}</div>
    </div>`;
  }).join('');

  updateChecklistProgress(type, checked, total);
}

function toggleChecklistItem(type, id) {
  checklistState[type][id] = !checklistState[type][id];
  saveChecklistState(type);
  renderChecklist(type);
}

function updateChecklistProgress(type, checked, total) {
  const pct = total ? Math.round((checked / total) * 100) : 0;
  document.getElementById('progressFill-' + type).style.width = pct + '%';
  document.getElementById('progressText-' + type).textContent = `${checked} / ${total}`;
}

function resetChecklist(type) {
  if (!confirm('체크 상태를 모두 초기화할까요?')) return;
  checklistState[type] = {};
  saveChecklistState(type);
  renderChecklist(type);
}

function setChecklistDateLabel(type, suffix) {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('dateLabel-' + type).textContent =
    `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} (${days[d.getDay()]}) ${suffix}`;
}

checklistState.opening = loadChecklistState('opening');
checklistState.closing = loadChecklistState('closing');
setChecklistDateLabel('opening', '오프닝');
setChecklistDateLabel('closing', '마감');
renderChecklist('opening');
renderChecklist('closing');


function switchTab(tab) {
  ['recipe', 'opening', 'closing'].forEach(t => {
    document.getElementById('view-' + t).style.display = (t === tab) ? '' : 'none';
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  document.getElementById('fabGroup').style.display = (tab === 'recipe') ? '' : 'none';
}
